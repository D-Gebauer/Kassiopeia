[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kassiopeia"
version = "0.1.0"
description = "Forward-model weak lensing, galaxy clustering, CMB lensing and ISW maps from full-sky HEALPix density shells."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Gebauer", email = "git@gebauer.ai" }]
keywords = [
    "cosmology",
    "weak-lensing",
    "galaxy-clustering",
    "cmb-lensing",
    "isw",
    "healpix",
    "forward-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "healpy>=1.16",
    "pyccl>=3.0",
]

[project.optional-dependencies]
lognormal = ["glass>=2024.1", "camb"]   # camb: default transfer function of the matter spectra
loaders = ["h5py>=3.8", "pyyaml>=6.0", "astropy>=5.0"]
# BaryonForge itself is installed separately (pip install --no-deps BaryonForge): its
# release pins pyccl==2.8.0 and numpy 1.x, which conflict with this package. These are
# its remaining runtime dependencies.
baryons = ["tqdm", "numba", "joblib"]
rotation = ["ducc0>=0.30"]   # fast exact alm rotations (kassiopeia.rotation); healpy fallback
test = ["pytest>=7.0", "pytest-cov>=4.0"]
all = [
    "glass>=2024.1",
    "camb",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "astropy>=5.0",
    "ducc0>=0.30",
    "tqdm",
    "numba",
    "joblib",
]

[project.urls]
Homepage = "https://github.com/D-Gebauer/Kassiopeia"
Issues = "https://github.com/D-Gebauer/Kassiopeia/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
